name: CI
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - auth-service
          - product-service
          - order-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Make mvnw executable
        working-directory: ./${{ matrix.service }}
        run: chmod +x mvnw

      - name: Build and test ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: ./mvnw -B clean verify

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  test-ai-service:
    name: Test ai-service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" # same as the Docker image
          cache: "pip"
          cache-dependency-path: ai-service/requirements*.txt

      - name: Install dependencies
        working-directory: ./ai-service
        run: pip install -r requirements-dev.txt

      # No Groq key and no network needed: the tests use a fake Groq and fake services.
      - name: Run tests
        working-directory: ./ai-service
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t ai-service-ci ./ai-service

  notify:
    name: Signal Deployment Ready
    needs: [build-backend, build-frontend, test-ai-service]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Create deployment signal
        run: |
          cat > deployment-signal.json <<EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "status": "ready",
            "message": "All 6 Java services built + tested, ai-service tested, frontend built"
          }
          EOF
          cat deployment-signal.json

      - name: Upload deployment signal
        uses: actions/upload-artifact@v4
        with:
          name: deployment-signal
          path: deployment-signal.json
          retention-days: 7
