server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true # auto-create routes from Eureka service names
              lower-case-service-id: true

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowedOrigins: "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600

          routes:
            # ============ AUTH SERVICE ============
            - id: auth-service-route
              uri: lb://auth-service # lb:// = load-balanced via Eureka
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1 # removes /api before forwarding

            # ============ PRODUCT SERVICE ============
            - id: product-service-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1

            # ============ ORDER SERVICE ============
            - id: order-service-route
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
    health:
      show-details: always

logging:
  level:
    "[org.springframework.cloud.gateway]": INFO
    "[com.netflix.discovery]": OFF

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-please-use-a-long-random-string-min-32-chars}
