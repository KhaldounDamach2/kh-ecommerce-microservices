server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true # auto-create routes from Eureka service names
              lower-case-service-id: true
          routes:
            # Example placeholder route — will point to auth-service later
            - id: auth-service
              uri: lb://auth-service # lb:// = load-balanced via Eureka
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1 # removes /api before forwarding

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: OFF
