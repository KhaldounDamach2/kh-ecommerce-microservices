server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false # this IS the registry, don't register with itself
    fetch-registry: false # don't fetch from itself
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    enable-self-preservation: false # for dev only — kicks dead services faster
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflix.eureka: OFF
    com.netflix.discovery: OFF
